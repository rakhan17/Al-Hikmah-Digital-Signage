<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <rect width="300" height="300" rx="16" fill="#ffffff"/>
  <!-- QRIS Header Banner -->
  <path d="M 20 20 H 280 V 45 H 20 Z" fill="#ed1c24"/>
  <text x="150" y="38" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="2">QRIS</text>
  
  <!-- Outer Position Detection Pattern Top-Left -->
  <rect x="35" y="60" width="56" height="56" rx="6" fill="#111111"/>
  <rect x="43" y="68" width="40" height="40" rx="3" fill="#ffffff"/>
  <rect x="51" y="76" width="24" height="24" rx="2" fill="#111111"/>

  <!-- Outer Position Detection Pattern Top-Right -->
  <rect x="209" y="60" width="56" height="56" rx="6" fill="#111111"/>
  <rect x="217" y="68" width="40" height="40" rx="3" fill="#ffffff"/>
  <rect x="225" y="76" width="24" height="24" rx="2" fill="#111111"/>

  <!-- Outer Position Detection Pattern Bottom-Left -->
  <rect x="35" y="209" width="56" height="56" rx="6" fill="#111111"/>
  <rect x="43" y="217" width="40" height="40" rx="3" fill="#ffffff"/>
  <rect x="51" y="225" width="24" height="24" rx="2" fill="#111111"/>

  <!-- Alignment Pattern Bottom-Right -->
  <rect x="215" y="215" width="36" height="36" rx="4" fill="#111111"/>
  <rect x="221" y="221" width="24" height="24" rx="2" fill="#ffffff"/>
  <rect x="227" y="227" width="12" height="12" rx="1" fill="#111111"/>

  <!-- Random Decorative Data Modules -->
  <g fill="#111111">
    <rect x="105" y="60" width="12" height="12"/>
    <rect x="125" y="60" width="24" height="12"/>
    <rect x="160" y="60" width="12" height="24"/>
    <rect x="180" y="60" width="12" height="12"/>
    
    <rect x="105" y="80" width="24" height="12"/>
    <rect x="140" y="80" width="12" height="24"/>
    <rect x="165" y="90" width="25" height="12"/>
    
    <rect x="35" y="130" width="24" height="12"/>
    <rect x="70" y="130" width="12" height="24"/>
    <rect x="95" y="125" width="24" height="12"/>
    <rect x="130" y="130" width="40" height="12"/>
    <rect x="180" y="125" width="24" height="24"/>
    <rect x="215" y="130" width="50" height="12"/>

    <rect x="35" y="150" width="12" height="24"/>
    <rect x="55" y="155" width="24" height="12"/>
    <rect x="90" y="150" width="12" height="36"/>
    <rect x="110" y="155" width="30" height="12"/>
    <rect x="150" y="150" width="20" height="20"/>
    <rect x="180" y="155" width="35" height="12"/>
    <rect x="225" y="150" width="40" height="12"/>

    <rect x="35" y="180" width="36" height="12"/>
    <rect x="80" y="180" width="20" height="12"/>
    <rect x="110" y="180" width="12" height="24"/>
    <rect x="130" y="180" width="30" height="12"/>
    <rect x="170" y="180" width="20" height="12"/>
    <rect x="200" y="180" width="24" height="24"/>
    <rect x="235" y="180" width="30" height="12"/>

    <rect x="105" y="210" width="24" height="12"/>
    <rect x="140" y="210" width="12" height="24"/>
    <rect x="160" y="210" width="40" height="12"/>
    
    <rect x="105" y="235" width="12" height="30"/>
    <rect x="125" y="240" width="30" height="12"/>
    <rect x="165" y="235" width="35" height="12"/>

    <rect x="35" y="270" width="230" height="10" rx="3" fill="#ed1c24"/>
  </g>

  <!-- Center QRIS National Emblem Badge -->
  <rect x="120" y="120" width="60" height="60" rx="10" fill="#ffffff" stroke="#ed1c24" stroke-width="3"/>
  <path d="M 130 135 L 145 165 L 170 135" fill="none" stroke="#ed1c24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
